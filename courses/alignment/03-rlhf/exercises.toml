[[exercise]]
id = "bt-prob"
kind = "code"
starter = '''
ra, rb = map(float, input().split())
'''
solution = '''
import math

ra, rb = map(float, input().split())
p = 1 / (1 + math.exp(-(ra - rb)))
print(f"{p:.4f} {-math.log(p):.4f}")
'''
tests = [
  { input = "2.0 0.5\n", output = "0.8176 0.2014\n" },
  { input = "0 0\n", output = "0.5000 0.6931\n" },
  { input = "-1 1\n", output = "0.1192 2.1269\n" },
  { input = "3.2 3.1\n", output = "0.5250 0.6444\n" },
  { input = "5 -5\n", output = "1.0000 0.0000\n" },
]

[[exercise]]
id = "rm-eval"
kind = "code"
starter = '''
n = int(input())
'''
solution = '''
import math

def sigmoid(z):
    return 1 / (1 + math.exp(-z))


n = int(input())
total, right = 0.0, 0
for _ in range(n):
    rc, rr = map(float, input().split())
    total += -math.log(sigmoid(rc - rr))
    right += rc > rr
print(f"{total / n:.4f} {right / n:.1%}")
'''
tests = [
  { input = "3\n2.0 0.5\n0.1 0.3\n1.0 -1.0\n", output = "0.3755 66.7%\n" },
  { input = "1\n1 1\n", output = "0.6931 0.0%\n" },
  { input = "4\n0.5 -0.5\n2 1\n3 0\n-1 -2\n", output = "0.2471 100.0%\n" },
  { input = "8\n0.7 2.34\n-0.26 1.27\n2.62 0.12\n1.4 1.37\n2.15 -2.78\n-1.98 2.98\n1.48 -1.43\n1.45 -1.98\n", output = "1.1699 62.5%\n" },
]

[[exercise]]
id = "kl-optimal"
kind = "code"
starter = '''
ref = list(map(float, input().split()))
reward = list(map(float, input().split()))
beta = float(input())
'''
solution = '''
import math

ref = list(map(float, input().split()))
reward = list(map(float, input().split()))
beta = float(input())
weights = [p * math.exp(r / beta) for p, r in zip(ref, reward)]
total = sum(weights)
print(" ".join(f"{w / total:.4f}" for w in weights))
'''
tests = [
  { input = "0.3 0.3 0.2 0.2\n1.0 0.6 -1.0 -0.5\n1\n", output = "0.5238 0.3511 0.0473 0.0779\n" },
  { input = "0.5 0.5\n1 0\n0.5\n", output = "0.8808 0.1192\n" },
  { input = "0.25 0.25 0.25 0.25\n0 0 0 0\n2\n", output = "0.2500 0.2500 0.2500 0.2500\n" },
  { input = "0.7 0.2 0.1\n-1 0 2\n0.3\n", output = "0.0003 0.0025 0.9971\n" },
  { input = "0.1 0.9\n2 0\n10\n", output = "0.1195 0.8805\n" },
]

[[exercise]]
id = "ppo-clip"
kind = "code"
starter = '''
eps = float(input())
'''
solution = '''
import sys

eps = float(input())
for line in sys.stdin:
    parts = line.split()
    if len(parts) != 2:
        continue
    ratio, adv = float(parts[0]), float(parts[1])
    clipped = max(1 - eps, min(1 + eps, ratio))
    print(f"{min(ratio * adv, clipped * adv):.4f}")
'''
tests = [
  { input = "0.2\n1.0 1.0\n1.5 1.0\n0.5 -1.0\n", output = "1.0000\n1.2000\n-0.8000\n" },
  { input = "0.1\n1.05 2.0\n1.3 2.0\n0.7 -0.5\n0.95 -0.5\n", output = "2.1000\n2.2000\n-0.4500\n-0.4750\n" },
  { input = "0.2\n2.0 -1.5\n0.2 3.0\n", output = "-3.0000\n0.6000\n" },
]

