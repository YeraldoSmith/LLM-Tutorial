[[exercise]]
id = "lora-params"
kind = "code"
starter = '''
d_in, d_out, r = map(int, input().split())
'''
solution = '''
d_in, d_out, r = map(int, input().split())
full = d_in * d_out
lora = r * (d_in + d_out)
print(full, lora, f"{lora / full:.2%}")
'''
tests = [
  { input = "4096 4096 8\n", output = "16777216 65536 0.39%\n" },
  { input = "4096 14336 16\n", output = "58720256 294912 0.50%\n" },
  { input = "768 768 4\n", output = "589824 6144 1.04%\n" },
  { input = "8192 1024 64\n", output = "8388608 589824 7.03%\n" },
  { input = "10 10 1\n", output = "100 20 20.00%\n" },
]

[[exercise]]
id = "lora-forward"
kind = "code"
starter = '''
d_out, d_in, r = map(int, input().split())
'''
solution = '''
def matvec(M, x):
    return [sum(m * v for m, v in zip(row, x)) for row in M]


d_out, d_in, r = map(int, input().split())
W = [list(map(float, input().split())) for _ in range(d_out)]
A = [list(map(float, input().split())) for _ in range(r)]
B = [list(map(float, input().split())) for _ in range(d_out)]
alpha = float(input())
x = list(map(float, input().split()))
base = matvec(W, x)
delta = matvec(B, matvec(A, x))
print(" ".join(f"{b + alpha / r * d:.3f}" for b, d in zip(base, delta)))
'''
tests = [
  { input = "2 3 1\n1 0 2\n0 1 -1\n0.5 -0.5 1\n2\n-1\n2\n1 2 3\n", output = "17.000 -6.000\n" },
  { input = "2 2 2\n-1 -3\n2 1\n0 3\n-1 0\n-3 -2\n-2 3\n8\n-1 0\n", output = "-7.000 10.000\n" },
  { input = "3 4 2\n0 2 -3 -3\n1 0 0 -3\n-2 -3 -2 -2\n0 -2 2 -1\n0 3 0 0\n-3 3\n-3 1\n0 -3\n8\n0 2 -1 -1\n", output = "142.000 87.000 -74.000\n" },
  { input = "1 3 1\n0 1 2\n1 2 -2\n-1\n1\n0 -1 1\n", output = "5.000\n" },
  { input = "4 4 3\n3 1 2 2\n0 1 -3 -2\n-3 -2 2 2\n1 0 0 -2\n-2 2 -3 3\n-2 -3 -2 2\n1 -2 -1 -2\n1 1 0\n-3 1 -2\n2 2 3\n-2 -2 1\n2\n2 1 2 -1\n", output = "-7.000 10.333 -38.000 36.000\n" },
]

[[exercise]]
id = "model-lora"
kind = "code"
starter = '''
L, d, m, r = map(int, input().split())
'''
solution = '''
L, d, m, r = map(int, input().split())
total = L * m * r * (d + d)
print(f"{total / 1e6:.2f}M")
'''
tests = [
  { input = "32 4096 4 16\n", output = "16.78M\n" },
  { input = "80 8192 7 64\n", output = "587.20M\n" },
  { input = "12 768 2 8\n", output = "0.29M\n" },
  { input = "28 3584 4 32\n", output = "25.69M\n" },
]

[[exercise]]
id = "finetune-memory"
kind = "code"
starter = '''
N = float(input())
'''
solution = '''
N = float(input())
full = 16 * N
lora = 2 * N + 16 * N * 0.01
qlora = 0.5 * N + 16 * N * 0.01
print(f"{full:.1f} {lora:.1f} {qlora:.1f}")
'''
tests = [
  { input = "7\n", output = "112.0 15.1 4.6\n" },
  { input = "70\n", output = "1120.0 151.2 46.2\n" },
  { input = "0.6\n", output = "9.6 1.3 0.4\n" },
  { input = "405\n", output = "6480.0 874.8 267.3\n" },
  { input = "13\n", output = "208.0 28.1 8.6\n" },
]

