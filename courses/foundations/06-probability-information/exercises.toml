[[exercise]]
id = "perplexity"
kind = "code"
starter = ""
solution = '''
import math

ps = list(map(float, input().split()))
avg = sum(-math.log(p) for p in ps) / len(ps)
print(f"{math.exp(avg):.2f}")
'''
tests = [
  { input = "0.5 0.25 0.125\n", output = "4.00\n" },
  { input = "1 1 1\n", output = "1.00\n" },
  { input = "0.1\n", output = "10.00\n" },
]

