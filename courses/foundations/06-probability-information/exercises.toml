[[exercise]]
id = "softmax"
kind = "code"
starter = '''
import math

z = list(map(float, input().split()))
'''
solution = '''
import math

z = list(map(float, input().split()))
m = max(z)
exps = [math.exp(v - m) for v in z]
total = sum(exps)
print(" ".join(f"{e / total:.4f}" for e in exps))
'''
tests = [
  { input = "2 1 0.1\n", output = "0.6590 0.2424 0.0986\n" },
  { input = "0 0\n", output = "0.5000 0.5000\n" },
  { input = "1000 1000 1000 1000\n", output = "0.2500 0.2500 0.2500 0.2500\n" },
  { input = "-1 0 1\n", output = "0.0900 0.2447 0.6652\n" },
]

[[exercise]]
