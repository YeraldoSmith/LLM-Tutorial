[[exercise]]
id = "rmsnorm"
kind = "code"
starter = '''
x = list(map(float, input().split()))
'''
solution = '''
import math

x = list(map(float, input().split()))
rms = math.sqrt(sum(v * v for v in x) / len(x) + 1e-6)
print(" ".join(f"{v / rms:.4f}" for v in x))
'''
tests = [
  { input = "2 -1 4 3\n", output = "0.7303 -0.3651 1.4606 1.0954\n" },
  { input = "1 1 1 1\n", output = "1.0000 1.0000 1.0000 1.0000\n" },
  { input = "3 4\n", output = "0.8485 1.1314\n" },
  { input = "0.5 -0.25 0.125 2 -3\n", output = "0.3062 -0.1531 0.0766 1.2250 -1.8375\n" },
  { input = "10\n", output = "1.0000\n" },
]

