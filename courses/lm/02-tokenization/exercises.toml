[[exercise]]
id = "bpe-step"
kind = "code"
starter = '''
seq = list(input())
'''
solution = '''
seq = list(input())
counts = {}
for pair in zip(seq, seq[1:]):
    counts[pair] = counts.get(pair, 0) + 1
best = max(counts, key=counts.get)
out, i = [], 0
while i < len(seq):
    if i < len(seq) - 1 and (seq[i], seq[i + 1]) == best:
        out.append(seq[i] + seq[i + 1])
        i += 2
    else:
        out.append(seq[i])
        i += 1
print(best[0] + best[1])
print(" ".join(out))
'''
tests = [
  { input = "aaabdaaabac\n", output = "aa\naa a b d aa a b a c\n" },
  { input = "abab\n", output = "ab\nab ab\n" },
  { input = "hello\n", output = "he\nhe l l o\n" },
  { input = "banana\n", output = "an\nb an an a\n" },
  { input = "mississippi\n", output = "is\nm is s is s i p p i\n" },
  { input = "zzzz\n", output = "zz\nzz zz\n" },
]

