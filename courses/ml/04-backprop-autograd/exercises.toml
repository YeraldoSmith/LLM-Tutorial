a, b, c = (Value(float(t)) for t in input().split())
y = (a * b + c).relu()
y.backward()
print(f"{y.data:.2f} {a.grad:.2f} {b.grad:.2f} {c.grad:.2f}")
'''
solution = '''
class Value:
    def __init__(self, data, children=()):
        self.data = data
        self.grad = 0.0
        self._backward = lambda: None
        self._prev = set(children)

    def __add__(self, other):
        out = Value(self.data + other.data, (self, other))
        def _backward():
            self.grad += out.grad
            other.grad += out.grad
        out._backward = _backward
        return out

    def __mul__(self, other):
        out = Value(self.data * other.data, (self, other))
        def _backward():
            self.grad += other.data * out.grad
            other.grad += self.data * out.grad
        out._backward = _backward
        return out

    def relu(self):
        out = Value(max(0.0, self.data), (self,))
        def _backward():
            self.grad += (1.0 if self.data > 0 else 0.0) * out.grad
        out._backward = _backward
        return out

    def backward(self):
        order, seen = [], set()
        def build(v):
            if v not in seen:
                seen.add(v)
                for child in v._prev:
                    build(child)
                order.append(v)
        build(self)
        self.grad = 1.0
        for v in reversed(order):
            v._backward()


a, b, c = (Value(float(t)) for t in input().split())
y = (a * b + c).relu()
y.backward()
print(f"{y.data:.2f} {a.grad:.2f} {b.grad:.2f} {c.grad:.2f}")
'''
tests = [
  { input = "2 3 -1\n", output = "5.00 3.00 2.00 1.00\n" },
  { input = "2 3 -10\n", output = "0.00 0.00 0.00 0.00\n" },
  { input = "1.5 -2 4\n", output = "1.00 -2.00 1.50 1.00\n" },
]

