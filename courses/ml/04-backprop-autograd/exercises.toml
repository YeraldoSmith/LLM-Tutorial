[[exercise]]
id = "neuron-grad"
kind = "code"
starter = '''
import math

w, x, b = map(float, input().split())
'''
solution = '''
import math

w, x, b = map(float, input().split())
y = math.tanh(w * x + b)
local = 1 - y * y
print(f"{y:.4f} {local * x:.4f} {local:.4f}")
'''
