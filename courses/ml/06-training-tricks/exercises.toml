[[exercise]]
id = "lr-schedule"
kind = "code"
starter = '''
import math

step, warmup, total = map(int, input().split())
'''
solution = '''
import math

step, warmup, total = map(int, input().split())
if step < warmup:
    lr = (step + 1) / warmup
else:
    lr = 0.5 * (1 + math.cos(math.pi * (step - warmup) / (total - warmup)))
print(f"{lr:.4f}")
'''
tests = [
  { input = "0 10 100\n", output = "0.1000\n" },
  { input = "9 10 100\n", output = "1.0000\n" },
  { input = "10 10 100\n", output = "1.0000\n" },
  { input = "30 10 100\n", output = "0.8830\n" },
  { input = "55 10 100\n", output = "0.5000\n" },
  { input = "100 10 100\n", output = "0.0000\n" },
]

[[exercise]]
id = "rmsnorm"
kind = "code"
starter = '''
import math

x = list(map(float, input().split()))
'''
solution = '''
import math

x = list(map(float, input().split()))
rms = math.sqrt(sum(a * a for a in x) / len(x) + 1e-5)
print(" ".join(f"{a / rms:.3f}" for a in x))
'''
tests = [
  { input = "2 4 6 8\n", output = "0.365 0.730 1.095 1.461\n" },
  { input = "3 4\n", output = "0.849 1.131\n" },
  { input = "-1 1\n", output = "-1.000 1.000\n" },
  { input = "0 0 5\n", output = "0.000 0.000 1.732\n" },
  { input = "1 2 3\n", output = "0.463 0.926 1.389\n" },
]

[[exercise]]
id = "clip-norm"
kind = "code"
starter = '''
import math

grads = list(map(float, input().split()))
max_norm = float(input())
'''
solution = '''
import math

grads = list(map(float, input().split()))
max_norm = float(input())
norm = math.sqrt(sum(g * g for g in grads))
if norm > max_norm:
    grads = [g * max_norm / norm for g in grads]
print(" ".join(f"{g:.4f}" for g in grads))
'''
tests = [
  { input = "0.3 -0.4\n1\n", output = "0.3000 -0.4000\n" },
  { input = "30 -40\n1\n", output = "0.6000 -0.8000\n" },
  { input = "3 4 12\n6.5\n", output = "1.5000 2.0000 6.0000\n" },
  { input = "1 1 1 1\n1\n", output = "0.5000 0.5000 0.5000 0.5000\n" },
  { input = "5\n10\n", output = "5.0000\n" },
]

