[[exercise]]
id = "forward"
kind = "code"
starter = '''
W1 = [[0.5, -1.0], [1.0, 0.5]]
b1 = [0.0, -1.0]
W2 = [1.0, 1.5]
b2 = 0.0

def relu(v):
    return max(0.0, v)

x1, x2 = map(float, input().split())
'''
solution = '''
W1 = [[0.5, -1.0], [1.0, 0.5]]
b1 = [0.0, -1.0]
W2 = [1.0, 1.5]
b2 = 0.0

def relu(v):
    return max(0.0, v)

x1, x2 = map(float, input().split())
h = [relu(W1[i][0] * x1 + W1[i][1] * x2 + b1[i]) for i in range(2)]
print(f"{W2[0] * h[0] + W2[1] * h[1] + b2:.2f}")
'''
tests = [
  { input = "1 2\n", output = "1.50\n" },
  { input = "4 0\n", output = "6.50\n" },
  { input = "0 0\n", output = "0.00\n" },
]

