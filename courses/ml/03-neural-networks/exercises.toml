[[exercise]]
id = "activations"
kind = "code"
starter = '''
import math

x = float(input())
'''
solution = '''
import math

x = float(input())
print(f"{max(0.0, x):.4f}")
print(f"{1 / (1 + math.exp(-x)):.4f}")
print(f"{0.5 * x * (1 + math.erf(x / math.sqrt(2))):.4f}")
'''
tests = [
  { input = "1\n", output = "1.0000\n0.7311\n0.8413\n" },
  { input = "0\n", output = "0.0000\n0.5000\n0.0000\n" },
  { input = "2.5\n", output = "2.5000\n0.9241\n2.4845\n" },
]

