[[exercise]]
id = "broadcast-shape"
kind = "code"
starter = '''
a = list(map(int, input().split()))
b = list(map(int, input().split()))
'''
solution = '''
a = list(map(int, input().split()))
b = list(map(int, input().split()))
n = max(len(a), len(b))
a = [1] * (n - len(a)) + a
b = [1] * (n - len(b)) + b
result = []
for x, y in zip(a, b):
    if x == y or y == 1:
        result.append(x)
    elif x == 1:
        result.append(y)
    else:
        print("error")
        break
else:
    print(*result)
'''
tests = [
  { input = "2 3\n3\n", output = "2 3\n" },
  { input = "2 3\n2 1\n", output = "2 3\n" },
  { input = "4 1 5\n3 1\n", output = "4 3 5\n" },
  { input = "2 3\n2\n", output = "error\n" },
  { input = "8 1 6 1\n7 1 5\n", output = "8 7 6 5\n" },
  { input = "1\n5\n", output = "5\n" },
  { input = "3 4\n2 3 4\n", output = "2 3 4\n" },
  { input = "2 3 4\n3 5\n", output = "error\n" },
]

