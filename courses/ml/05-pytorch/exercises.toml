[[exercise]]
id = "torch-grad"
kind = "code"
requires = ["torch"]
starter = '''
import torch

x = torch.tensor(float(input()), requires_grad=True)
'''
solution = '''
import torch

x = torch.tensor(float(input()), requires_grad=True)
y = x ** 3 + 2 * x
y.backward()
print(f"{y.item():.2f} {x.grad.item():.2f}")
'''
tests = [
  { input = "2\n", output = "12.00 14.00\n" },
  { input = "0\n", output = "0.00 2.00\n" },
  { input = "-1\n", output = "-3.00 5.00\n" },
  { input = "3\n", output = "33.00 29.00\n" },
]

