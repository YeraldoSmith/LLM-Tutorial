[[exercise]]
id = "softmax-grad"
kind = "code"
starter = ""
solution = '''
import math

z = list(map(float, input().split()))
target = int(input())
m = max(z)
e = [math.exp(v - m) for v in z]
s = sum(e)
p = [v / s for v in e]
grad = [pk - (1 if k == target else 0) for k, pk in enumerate(p)]
print(" ".join(f"{g:.4f}" for g in grad))
'''
tests = [
  { input = "2 1 0.1\n0\n", output = "-0.3410 0.2424 0.0986\n" },
  { input = "0 0\n1\n", output = "0.5000 -0.5000\n" },
  { input = "1 2 3\n2\n", output = "0.0900 0.2447 -0.3348\n" },
]

[[exercise]]
id = "accuracy"
kind = "code"
starter = ""
solution = '''
n, K = map(int, input().split())
correct = 0
for _ in range(n):
    vals = input().split()
    probs = list(map(float, vals[:K]))
    label = int(vals[K])
    pred = max(range(K), key=lambda k: probs[k])
    correct += pred == label
print(f"{correct / n * 100:.1f}%")
'''
tests = [
  { input = "4 3\n0.7 0.2 0.1 0\n0.1 0.3 0.6 2\n0.5 0.4 0.1 1\n0.2 0.5 0.3 1\n", output = "75.0%\n" },
  { input = "2 2\n0.5 0.5 0\n0.5 0.5 1\n", output = "50.0%\n" },
  { input = "3 2\n0.9 0.1 1\n0.2 0.8 0\n0.6 0.4 1\n", output = "0.0%\n" },
]

