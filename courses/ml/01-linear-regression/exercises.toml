[[exercise]]
id = "one-step"
kind = "code"
starter = '''
xs = [1, 2, 3, 4, 5]
ys = [3, 5, 7, 9, 11]
w, b, lr = map(float, input().split())
'''
solution = '''
xs = [1, 2, 3, 4, 5]
ys = [3, 5, 7, 9, 11]
w, b, lr = map(float, input().split())
N = len(xs)
errors = [(w * x + b) - y for x, y in zip(xs, ys)]
grad_w = 2 / N * sum(e * x for e, x in zip(errors, xs))
grad_b = 2 / N * sum(errors)
w -= lr * grad_w
b -= lr * grad_b
print(f"{w:.4f} {b:.4f}")
'''
tests = [
  { input = "0 0 0.05\n", output = "2.5000 0.7000\n" },
  { input = "2 1 0.1\n", output = "2.0000 1.0000\n" },
  { input = "1 0 0.01\n", output = "1.2800 0.0800\n" },
]

[[exercise]]
id = "train"
kind = "code"
starter = ""
solution = '''
n = int(input())
xs = list(map(float, input().split()))
ys = list(map(float, input().split()))
lr, steps = input().split()
lr, steps = float(lr), int(steps)
w = b = 0.0
for _ in range(steps):
    errors = [(w * x + b) - y for x, y in zip(xs, ys)]
    grad_w = 2 / n * sum(e * x for e, x in zip(errors, xs))
    grad_b = 2 / n * sum(errors)
    w -= lr * grad_w
    b -= lr * grad_b
print(f"{w:.3f} {b:.3f}")
'''
tests = [
  { input = "5\n1 2 3 4 5\n3 5 7 9 11\n0.05 1000\n", output = "2.000 1.000\n" },
  { input = "4\n0 1 2 3\n-1 2 5 8\n0.05 2000\n", output = "3.000 -1.000\n" },
  { input = "3\n1 2 3\n1 4 7\n0.1 1000\n", output = "3.000 -2.000\n" },
]

